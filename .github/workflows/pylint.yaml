name: Pylint
on:
  push:
    branches:
      - main
      - dev
      # file paths to consider in the event
    paths:
      - 'examples/**'
      - 'gptcache/**'
      - 'tests/**'
      - 'docs/**'
      - '!**.md'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - dev
      # file paths to consider in the event
    paths:
      - 'examples/**'
      - 'gptcache/**'
      - 'tests/**'
      - 'docs/**'
      - '!**.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: 3.8
    - name: Python pylint
      run: |
        pip install pylint==2.10.2
        make pylint_check
    - name: Make the readthedoc html
      shell: bash
      working-directory: docs
      run: |
        pip install -r requirements.txt
        make html
