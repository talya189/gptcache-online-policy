name: CARMA project CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PIP_CONFIG_FILE: /dev/null
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_NO_INPUT: "1"

jobs:
  python38-compatibility:
    name: Python 3.8.20 compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.8.20
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.8.20
          cache: pip
          cache-dependency-path: requirements-python38.lock

      - name: Install the Python 3.8 compatibility environment
        run: |
          python -m pip --isolated --disable-pip-version-check install \
            --no-input \
            --index-url https://pypi.org/simple \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements-python38.lock
          python -m pip --isolated --disable-pip-version-check install \
            --no-input --no-index --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Compile and import the CARMA integration
        run: |
          python -m py_compile \
            gptcache/manager/data_manager.py \
            gptcache/manager/eviction/base.py \
            gptcache/manager/eviction/carma.py \
            gptcache/manager/eviction/manager.py \
            gptcache/manager/eviction_manager.py \
            gptcache/manager/factory.py \
            gptcache/manager/scalar_data/base.py \
            gptcache/manager/scalar_data/sql_storage.py \
            tests/unit_tests/eviction/test_carma.py \
            tests/project_tests/test_carma_failure_paths.py \
            tests/project_tests/test_carma_integration.py
          python - <<'PY'
          import gptcache
          from gptcache.manager.eviction.carma import ClusterAdaptiveEviction

          policy = ClusterAdaptiveEviction(maxsize=1, on_evict=lambda keys: None)
          assert gptcache.__version__
          assert policy.policy == "CARMA"
          PY

      - name: Run backend-free CARMA tests
        run: |
          # SQLite/FAISS integration stays in the pinned Python 3.12 job. This
          # floor-version job deliberately avoids unsupported optional stacks.
          python -m pytest -q -o addopts='' \
            tests/unit_tests/eviction/test_carma.py \
            tests/project_tests/test_carma_failure_paths.py::test_callback_failure_rolls_back_and_marks_policy_unhealthy \
            tests/project_tests/test_carma_failure_paths.py::test_late_unhashable_batch_id_is_rejected_before_any_transition \
            tests/project_tests/test_carma_failure_paths.py::test_distinct_same_repr_ids_are_not_collapsed_in_callback \
            tests/project_tests/test_carma_failure_paths.py::test_batch_callback_never_deletes_an_id_resident_in_final_state \
            tests/project_tests/test_carma_failure_paths.py::test_full_cell_bound_never_cross_assigns_topic_ownership \
            tests/project_tests/test_carma_failure_paths.py::test_restore_over_capacity_uses_stored_lru_not_semantic_support \
            tests/project_tests/test_carma_failure_paths.py::test_admission_disabled_does_not_reject_zero_quota_candidate \
            tests/project_tests/test_carma_failure_paths.py::test_vector_delete_failure_keeps_scalar_rows_recoverable

  host-verification:
    name: Python 3.12 host verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: requirements-project.lock

      - name: Install the locked project environment
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          {
            python -m pip --isolated --disable-pip-version-check install \
              --no-input \
              --index-url https://pypi.org/simple \
              --require-hashes \
              --only-binary=:all: \
              --requirement requirements-project.lock &&
            python -m pip --isolated --disable-pip-version-check install \
              --no-input --no-index --no-deps --no-build-isolation --editable . &&
            python -m pip check &&
            echo "[install] pip check PASS"
          } 2>&1 | tee artifacts/ci/host-install.log
          python -m pip list --format=freeze > artifacts/ci/host-packages.txt

      - name: Run project verification
        env:
          CARMA_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/ci
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          bash scripts/verify_project.sh 2>&1 | tee artifacts/ci/host-verification.log

      - name: Validate and record machine-readable host evidence
        run: |
          python scripts/write_reproducibility_evidence.py host \
            --evidence-root artifacts/ci \
            --expected-source-commit "${GITHUB_SHA}"

      - name: Upload deterministic CI artifacts
        if: always() && hashFiles('artifacts/ci/**') != ''
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: carma-ci-artifacts
          path: artifacts/ci
          if-no-files-found: error

  benchmark-lock-verification:
    name: Python 3.12 full-analysis lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: requirements-benchmark.lock

      - name: Install and validate the full-analysis lock
        run: |
          python -m venv "${RUNNER_TEMP}/carma-benchmark-lock"
          benchmark_python="${RUNNER_TEMP}/carma-benchmark-lock/bin/python"
          "${benchmark_python}" -m pip --isolated --disable-pip-version-check install \
            --no-input \
            --index-url https://pypi.org/simple \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements-benchmark.lock
          "${benchmark_python}" -m pip check
          "${benchmark_python}" - <<'PY'
          import onnxruntime
          import scipy
          import tokenizers
          import transformers

          print(
              "full-analysis imports:",
              onnxruntime.__version__,
              scipy.__version__,
              tokenizers.__version__,
              transformers.__version__,
          )
          PY

  container-verification:
    name: Pinned container verification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate generated dependency locks
        run: python3 scripts/generate_hashed_locks.py --check

      - name: Prepare private reproducibility evidence paths
        run: |
          mkdir -p artifacts/docker-run-1 artifacts/docker-run-2
          # The hosted runner workspace is private and ephemeral. Only these two
          # bind-mount leaves are writable by the image's unprivileged UID.
          chmod 0777 artifacts/docker-run-1 artifacts/docker-run-2
          git rev-parse HEAD > artifacts/container-source-commit.txt

      - name: Build the pinned project image
        run: |
          set -o pipefail
          docker build \
            --no-cache \
            --pull \
            --progress=plain \
            --platform linux/amd64 \
            --file Dockerfile.project \
            --tag carma-project:ci . \
            2>&1 | tee artifacts/docker-build.log
          docker image inspect --format '{{.Id}}' carma-project:ci \
            > artifacts/container-image-id.txt
          docker image inspect carma-project:ci \
            > artifacts/container-image-inspect.json

      - name: Run two clean network-isolated containers
        run: |
          set -o pipefail
          for label in 1 2; do
            container_id="$(docker create \
              --network none \
              --cap-drop ALL \
              --security-opt=no-new-privileges \
              --platform linux/amd64 \
              --mount "type=bind,src=${GITHUB_WORKSPACE}/artifacts/docker-run-${label},dst=/artifacts" \
              --env CARMA_ARTIFACT_DIR=/artifacts \
              carma-project:ci)"
            set +e
            docker start --attach "${container_id}" \
              2>&1 | tee "artifacts/docker-run-${label}.log"
            run_status="${PIPESTATUS[0]}"
            set -e
            docker inspect "${container_id}" \
              > "artifacts/docker-run-${label}.inspect.json"
            docker rm "${container_id}" >/dev/null
            if [[ "${run_status}" -ne 0 ]]; then
              echo "Container ${label} exited with status ${run_status}" >&2
              exit "${run_status}"
            fi
          done

      - name: Derive, compare, and record paired-container evidence
        run: |
          python3 scripts/write_reproducibility_evidence.py container \
            --evidence-root artifacts \
            --expected-source-commit "${GITHUB_SHA}"

      - name: Upload paired container evidence
        if: always() && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: carma-container-reproducibility
          path: artifacts
          if-no-files-found: error
