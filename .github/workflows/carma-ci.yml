name: CARMA project CI

on:
  push:
    branches:
      - feature/online-cluster-aware-cache
    paths:
      - "gptcache/**"
      - "benchmarks/**"
      - "tests/**"
      - "scripts/verify_project.sh"
      - "requirements-project.txt"
      - "requirements-python38.txt"
      - "Dockerfile.project"
      - ".github/workflows/carma-ci.yml"
  pull_request:
    paths:
      - "gptcache/**"
      - "benchmarks/**"
      - "tests/**"
      - "scripts/verify_project.sh"
      - "requirements-project.txt"
      - "requirements-python38.txt"
      - "Dockerfile.project"
      - ".github/workflows/carma-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carma-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python38-compatibility:
    name: Python 3.8.20 compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.8.20
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.8.20
          cache: pip
          cache-dependency-path: requirements-python38.txt

      - name: Install the Python 3.8 compatibility environment
        run: |
          python -m pip install --requirement requirements-python38.txt
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Compile and import the CARMA integration
        run: |
          python -m py_compile \
            gptcache/manager/data_manager.py \
            gptcache/manager/eviction/base.py \
            gptcache/manager/eviction/carma.py \
            gptcache/manager/eviction/manager.py \
            gptcache/manager/eviction_manager.py \
            gptcache/manager/factory.py \
            gptcache/manager/scalar_data/base.py \
            gptcache/manager/scalar_data/sql_storage.py \
            tests/unit_tests/eviction/test_carma.py \
            tests/project_tests/test_carma_failure_paths.py \
            tests/project_tests/test_carma_integration.py
          python - <<'PY'
          import gptcache
          from gptcache.manager.eviction.carma import ClusterAdaptiveEviction

          policy = ClusterAdaptiveEviction(maxsize=1, on_evict=lambda keys: None)
          assert gptcache.__version__
          assert policy.policy == "CARMA"
          PY

      - name: Run backend-free CARMA tests
        run: |
          # SQLite/FAISS integration stays in the pinned Python 3.12 job. This
          # floor-version job deliberately avoids unsupported optional stacks.
          python -m pytest -q -o addopts='' \
            tests/unit_tests/eviction/test_carma.py \
            tests/project_tests/test_carma_failure_paths.py::test_callback_failure_rolls_back_and_marks_policy_unhealthy \
            tests/project_tests/test_carma_failure_paths.py::test_late_unhashable_batch_id_is_rejected_before_any_transition \
            tests/project_tests/test_carma_failure_paths.py::test_distinct_same_repr_ids_are_not_collapsed_in_callback \
            tests/project_tests/test_carma_failure_paths.py::test_batch_callback_never_deletes_an_id_resident_in_final_state \
            tests/project_tests/test_carma_failure_paths.py::test_full_cell_bound_never_cross_assigns_topic_ownership \
            tests/project_tests/test_carma_failure_paths.py::test_restore_over_capacity_uses_stored_lru_not_semantic_support \
            tests/project_tests/test_carma_failure_paths.py::test_admission_disabled_does_not_reject_zero_quota_candidate \
            tests/project_tests/test_carma_failure_paths.py::test_vector_delete_failure_keeps_scalar_rows_recoverable

  host-verification:
    name: Python 3.12 host verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: requirements-project.txt

      - name: Install the locked project environment
        run: |
          python -m pip install --requirement requirements-project.txt
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Run project verification
        env:
          CARMA_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/ci
        run: bash scripts/verify_project.sh

      - name: Upload deterministic CI artifacts
        if: always() && hashFiles('artifacts/ci/**') != ''
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: carma-ci-artifacts
          path: artifacts/ci
          if-no-files-found: error

  container-verification:
    name: Pinned container verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the pinned project image
        run: docker build --file Dockerfile.project --tag carma-project:ci .

      - name: Run the same verification entrypoint
        run: docker run --rm carma-project:ci
